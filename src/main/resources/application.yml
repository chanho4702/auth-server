server:
  port: 9000
  # 게이트웨이(:8000) 뒤에서 X-Forwarded-* 헤더를 신뢰해 OIDC redirect_uri를 게이트웨이 호스트로 구성.
  forward-headers-strategy: framework
spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://localhost:5433/authdb
    username: keycloak
    password: keycloak
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: platform-bff
            client-secret: platform-bff-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/sso-demo

platform:
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 1209600
  issuer: http://localhost:9000
  frontend-url: http://localhost:5173
