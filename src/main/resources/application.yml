server:
  port: 9000
  # 게이트웨이(:8000) 뒤에서 X-Forwarded-* 헤더를 신뢰해 OIDC redirect_uri를 게이트웨이 호스트로 구성.
  forward-headers-strategy: framework
spring:
  cloud:
    discovery:
      client:
        # 서비스 health는 자기 상태(db)만 본다 — 유레카 상태는 게이트웨이 대시보드가 eureka 컴포넌트로 따로 프로브한다(설계 §3).
        health-indicator:
          enabled: false
  application:
    name: auth-server
  # 모든 자격증명/URL은 env로 오버라이드 가능. 기본값은 로컬 dev 전용 — 운영에서는 반드시 주입.
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/authdb}
    username: ${AUTH_DB_USERNAME:keycloak}
    password: ${AUTH_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:platform-bff}
            client-secret: ${OIDC_CLIENT_SECRET:platform-bff-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sso-demo}

# 내부망 전용 관측 표면. 게이트웨이 라우트는 /api/**뿐이고 nginx도 actuator를 넘기지 않으므로
# 외부에서 닿지 않는다. 노출은 health/info/prometheus뿐 — 나머지 엔드포인트는 include에 없어서 404다.
# prometheus는 Alloy가 도커 내부망에서 긁는 메트릭이다(infra-settings observability).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}   # 모든 미터에 서비스 이름 태그(Grafana 서비스별 분리)
  endpoint:
    health:
      show-details: always
  info:
    build:
      enabled: true

  health:
    eureka:
      enabled: false         # 유레카는 대시보드가 따로 본다(설계 §3)
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # Windows/사설망에서 DESKTOP-xxx.mshome.net 같은 DNS 해석 불가 호스트명으로 등록되면
    # 게이트웨이의 lb:// 해석이 UnknownHostException으로 죽는다 — IP로 등록 (E2E에서 실측).
    prefer-ip-address: true

platform:
  access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}
  issuer: ${PLATFORM_ISSUER:http://localhost:9000}
  # 자체 AT의 aud 클레임. 리소스서버(board-service 등)가 같은 값을 검증한다.
  audience: ${PLATFORM_AUDIENCE:platform-api}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # RT 쿠키 Secure 속성. 운영(https)에서는 true로 주입.
  cookie-secure: ${COOKIE_SECURE:false}
  # rotate 경쟁(멀티탭) vs 도난 구분 창. 이내 재사용은 관용(가족 생존), 경과 재사용은 가족 전멸.
  rotation-grace-seconds: ${ROTATION_GRACE_SECONDS:30}
  # 가족 생성 기준 절대 세션 상한(기본 90일) — sliding 만료의 영구 세션 방지
  session-absolute-ttl-seconds: ${SESSION_ABSOLUTE_TTL_SECONDS:7776000}
  # RT 청소 배치 cron (기본 매일 04:00). PAT 청소 배치도 같은 cron을 쓴다.
  token-cleanup-cron: ${TOKEN_CLEANUP_CRON:0 0 4 * * *}
  # PAT 교환으로 발급하는 JWT의 TTL. 세션 AT(900s)보다 짧게 둬서 폐기 후 잔존 시간을 줄인다.
  pat-jwt-ttl-seconds: ${PAT_JWT_TTL_SECONDS:300}
  # 만료·폐기된 PAT 행을 물리 삭제하기까지의 보존 기간(감사용).
  pat-retention-days: ${PAT_RETENTION_DAYS:90}
  # 리프레시 회전 때 Keycloak 계정·롤 재확인(2026-10-24 권한·계정 점검 M1 일부). org-service와 같은 platform-admin
  # service account(view-users)로 Admin REST를 읽는다. 시크릿이 비면 재확인 없이 로그인 때 roles를 그대로 쓴다(예전 동작).
  #   · KC에서 잠김·삭제 → 리프레시 401 + 그 사람의 RT 전부 폐기
  #   · KC 롤 변경 → 새 AT부터 반영(cache-seconds만큼 늦을 수 있다)
  #   · KC 장애 → 마지막으로 맞춘 roles가 max-stale-seconds 안이면 그대로, 넘으면 503 {"error":"auth_unavailable"}(쿠키 유지)
  keycloak-sync:
    enabled: ${KC_ROLE_SYNC_ENABLED:true}
    admin-client-id: ${KC_ADMIN_CLIENT_ID:platform-admin}
    admin-client-secret: ${KC_ADMIN_CLIENT_SECRET:}
    cache-seconds: ${KC_ROLE_SYNC_CACHE_SECONDS:60}
    max-stale-seconds: ${KC_ROLE_SYNC_MAX_STALE_SECONDS:86400}
  org:
    # org-service 서비스 간 API(/internal/org/**). 초대 확인·수락은 로그인 도중에 일어나
    # 사용자 토큰이 없으므로 이 토큰이 유일한 인증이다. 비어 있으면 초대 링크는 그냥
    # 평소 로그인으로 흘러가고(안내 페이지), 이메일 대조 경로만 남는다.
    service-uri: ${ORG_SERVICE_URI:http://localhost:9130}
    # 옛 공용 토큰 — 이제 platform.internal.account-sync-token·org-identity-token의 폴백으로만 쓴다(N5).
    internal-token: ${ORG_INTERNAL_TOKEN:}
  security:
    # docker·prod 프로필에서 기본 비밀값(OIDC 시크릿 platform-bff-secret, DB 비밀번호 keycloak)으로 뜨면
    # fail(기본) = 기동 실패, warn = 경고만(실값 주입 전 과도기). DefaultSecretsGuard(P-20).
    default-secrets: ${PLATFORM_DEFAULT_SECRETS_POLICY:fail}
  agent:
    # 옛 /internal/** 공용 게이트 시크릿 — 이제 직접 쓰지 않고 아래 platform.internal.*의 폴백으로만 남는다(N5).
    internal-secret: ${AGENT_INTERNAL_SECRET:}
  # 내부 비밀 용도별 분리(N5, 2026-11-08). 경로마다 허용 값이 따로다 — 한 값이 새도 다른 경로는 열리지 않는다.
  # 값은 콤마로 여러 개 적을 수 있다(신,구 — 무중단 회전: 수신에 "신,구" → 발신을 신으로 → 수신에서 구 제거).
  # 새 변수가 비면(없음·빈 문자열·빈 항목뿐) 옛 변수로 폴백한다 — 폴백은 Java(InternalSecretFilter.orLegacy)에서 한다:
  # Spring 플레이스홀더 기본값은 "프로퍼티 없음"에만 적용돼 compose가 넘기는 빈 문자열을 못 잡는다. 모두 비면 해당 경로 fail-closed(403).
  internal:
    # 게이트웨이 → /internal/pat/exchange, /internal/pat/stats (X-Internal-Secret). 비면 AGENT_INTERNAL_SECRET.
    pat-exchange-secret: ${AUTH_PAT_EXCHANGE_SECRET:}
    # agent-service → /internal/agents, /internal/service-tokens (X-Internal-Secret). 비면 AGENT_INTERNAL_SECRET.
    agent-admin-secret: ${AUTH_AGENT_ADMIN_SECRET:}
    # org-service → /internal/users/** (X-Internal-Token, 구성원 비활성 전파). 비면 ORG_INTERNAL_TOKEN.
    account-sync-token: ${AUTH_ACCOUNT_SYNC_TOKEN:}
    # auth-server → org /internal/org/invitations/**, members/ensure, members/{id}/authz (X-Internal-Token). 비면 ORG_INTERNAL_TOKEN.
    # 보내는 값이라 목록이면 첫 항목만 싣는다.
    org-identity-token: ${ORG_IDENTITY_TOKEN:}
