server:
  port: 9000
  # 게이트웨이(:8000) 뒤에서 X-Forwarded-* 헤더를 신뢰해 OIDC redirect_uri를 게이트웨이 호스트로 구성.
  forward-headers-strategy: framework
spring:
  application:
    name: auth-server
  # 모든 자격증명/URL은 env로 오버라이드 가능. 기본값은 로컬 dev 전용 — 운영에서는 반드시 주입.
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/authdb}
    username: ${AUTH_DB_USERNAME:keycloak}
    password: ${AUTH_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:platform-bff}
            client-secret: ${OIDC_CLIENT_SECRET:platform-bff-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sso-demo}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # Windows/사설망에서 DESKTOP-xxx.mshome.net 같은 DNS 해석 불가 호스트명으로 등록되면
    # 게이트웨이의 lb:// 해석이 UnknownHostException으로 죽는다 — IP로 등록 (E2E에서 실측).
    prefer-ip-address: true

platform:
  access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}
  issuer: ${PLATFORM_ISSUER:http://localhost:9000}
  # 자체 AT의 aud 클레임. 리소스서버(board-service 등)가 같은 값을 검증한다.
  audience: ${PLATFORM_AUDIENCE:platform-api}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # RT 쿠키 Secure 속성. 운영(https)에서는 true로 주입.
  cookie-secure: ${COOKIE_SECURE:false}
---
# docker 프로필 — 컨테이너 배포 전용 (compose가 SPRING_PROFILES_ACTIVE=docker 주입).
# 디스커버리/백채널은 KEYCLOAK_ISSUER_URI(keycloak:8080)로 일관 — iss 검증도 그 값과 일치.
# 브라우저 리다이렉트(authorization endpoint)만 호스트 오리진(localhost:8080)으로 오버라이드.
# Boot는 issuer 디스커버리 후 명시 프로퍼티로 덮어쓴다 — authorization-uri만 바뀐다.
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_BROWSER_BASE:http://localhost:8080}/realms/sso-demo/protocol/openid-connect/auth
