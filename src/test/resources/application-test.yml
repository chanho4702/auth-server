spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
# OAuth2 client 등록은 TestOAuth2ClientConfig 의 ClientRegistrationRepository 빈으로
# 제공한다. 빈을 직접 주면 Boot 자동설정(@ConditionalOnMissingBean)이 back off 하여
# base application.yml 의 issuer-uri discovery(네트워크 호출)를 타지 않는다.
